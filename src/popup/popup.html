<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commyweb</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <span class="brand-title">Commyweb</span>
      </div>
      <button class="settings-toggle-btn" id="btn-toggle-settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Comment Mode Banner & Toggle -->
    <div class="mode-card">
      <div class="mode-info">
        <div class="mode-label" id="lbl-comment-mode">Comment Mode</div>
        <div class="mode-hint">Shortcut: <kbd>Alt</kbd> + <kbd>C</kbd></div>
      </div>
      <label class="switch">
        <input type="checkbox" id="chk-comment-mode">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Settings Drawer (Hidden by default) -->
    <div class="settings-drawer" id="settings-drawer">
      <div class="drawer-title">Collaboration Backend (No-DB)</div>
      <div class="user-profile-badge" id="user-badge" style="display: none;">
        <img class="profile-avatar" id="user-avatar" src="" alt="">
        <div class="profile-text">
          <div class="profile-status" id="lbl-connected-as">Connected as</div>
          <div class="profile-username" id="user-name">@username</div>
        </div>
      </div>
      <div class="form-group">
        <label for="input-github-token">GitHub Token (Fine-grained PAT)</label>
        <input type="password" id="input-github-token" placeholder="github_pat_...">
      </div>
      <div class="form-group">
        <label for="input-storage-repo">Storage Repository</label>
        <input type="text" id="input-storage-repo" placeholder="owner/repo-comments">
      </div>
      <button class="btn-primary" id="btn-save-settings">Save Settings</button>
    </div>

    <!-- Filters Tabs -->
    <div class="tabs-container">
      <button class="tab-btn active" data-tab="all" id="tab-all">All (<span id="count-all">0</span>)</button>
      <button class="tab-btn" data-tab="open" id="tab-open">Active (<span id="count-open">0</span>)</button>
      <button class="tab-btn" data-tab="resolved" id="tab-resolved">Resolved (<span id="count-resolved">0</span>)</button>
    </div>

    <!-- Comments List on current page -->
    <div class="comments-list" id="comments-list">
      <div class="empty-state" id="empty-state">
        <p id="lbl-no-comments">No comments yet on this page. Toggle Comment Mode and click anywhere to add one!</p>
      </div>
    </div>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
