<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commyweb</title>
  <link rel="stylesheet" href="/src/popup/popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img class="brand-logotype-img" src="/icons/logotype.png" alt="Commyweb" style="height: 22px; width: auto; object-fit: contain;">
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-toggle-invite" title="Invite Collaborators">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7.5" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
        </button>
        <button class="icon-btn" id="btn-toggle-settings" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Comment Mode Banner & Toggle -->
    <div class="mode-card">
      <div class="mode-info">
        <div class="mode-label" id="lbl-comment-mode">Comment Mode</div>
        <div class="mode-hint">Shortcut: <kbd>Alt</kbd> + <kbd>C</kbd></div>
      </div>
      <label class="switch">
        <input type="checkbox" id="chk-comment-mode">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Invite Collaborators Drawer -->
    <div class="drawer" id="invite-drawer">
      <div class="drawer-header">
        <div class="drawer-title" id="lbl-invite-title">Invite by Email</div>
      </div>
      <div class="invite-input-row">
        <input type="email" class="input-text" id="input-invite-email" placeholder="collaborator@company.com">
        <button class="btn-black" id="btn-send-invite">Invite</button>
      </div>
      <button class="btn-secondary" id="btn-copy-invite-link">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="lbl-copy-link">Copy Invitation Link</span>
      </button>
      <div class="toast" id="toast-invite">Link copied to clipboard!</div>
      <div class="drawer-title" id="lbl-members-title" style="margin-top: 4px;">Invited Members</div>
      <div class="members-list" id="invited-members-list">
        <div class="empty-state" style="padding: 10px;" id="lbl-no-members">No one invited yet.</div>
      </div>
    </div>

    <!-- Settings Drawer -->
    <div class="drawer" id="settings-drawer">
      <div class="drawer-header">
        <div class="drawer-title">Collaboration Backend (No-DB)</div>
      </div>
      <div class="user-profile-badge" id="user-badge" style="display: none;">
        <img class="profile-avatar" id="user-avatar" src="" alt="">
        <div class="profile-text">
          <div class="profile-status" id="lbl-connected-as">Connected as</div>
          <div class="profile-username" id="user-name">@username</div>
        </div>
      </div>
      <div class="form-group">
        <label for="input-github-token">GitHub Token (Fine-grained PAT)</label>
        <input type="password" class="input-text" id="input-github-token" placeholder="github_pat_...">
      </div>
      <div class="form-group">
        <label for="input-storage-repo">Storage Repository</label>
        <input type="text" class="input-text" id="input-storage-repo" placeholder="kiou98/Commyweb">
      </div>
      <button class="btn-black" id="btn-save-settings">Save Settings</button>
    </div>

    <!-- Filters Tabs -->
    <div class="tabs-container">
      <button class="tab-btn active" data-tab="all" id="tab-all">All (<span id="count-all">0</span>)</button>
      <button class="tab-btn" data-tab="open" id="tab-open">Active (<span id="count-open">0</span>)</button>
      <button class="tab-btn" data-tab="resolved" id="tab-resolved">Resolved (<span id="count-resolved">0</span>)</button>
    </div>

    <!-- Comments List on current page -->
    <div class="comments-list" id="comments-list">
      <div class="empty-state" id="empty-state">
        <p id="lbl-no-comments">No comments yet on this page. Toggle Comment Mode and click anywhere to add one!</p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/popup/popup.ts"></script>
</body>
</html>
