name: Release Commyweb Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release source
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('Release tag and package version must match');"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension
        run: npm test && node scripts/verify-notifications.cjs

      - name: Package Extension ZIP
        run: npm run package

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
